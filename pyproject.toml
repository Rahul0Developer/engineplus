[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enginepulse"
version = "0.1.0"
description = "A clean, tested, leakage-free toolkit for Remaining Useful Life prediction on NASA C-MAPSS turbofan data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnginePulse contributors" }]
keywords = [
    "predictive-maintenance",
    "remaining-useful-life",
    "cmapss",
    "prognostics",
    "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install stays small: numpy/pandas/scikit-learn cover the classical path.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0"]
deep = ["torch>=2.0"]
api = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]
docqa = ["chromadb>=0.5", "pypdf>=4.0", "sentence-transformers>=2.7"]
all = [
    "xgboost>=2.0",
    "torch>=2.0",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "httpx>=0.27",          # FastAPI TestClient transport
    "xgboost>=2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/enginepulse"
Issues = "https://github.com/yourusername/enginepulse/issues"

[project.scripts]
enginepulse = "enginepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/enginepulse"]
omit = ["*/docqa/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]
